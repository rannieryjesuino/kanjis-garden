<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121016">
  <meta name="description" content="Kanjis Garden — treino de leitura dos kanjis do New Progressive 1 e 2.">
  <title>Kanjis Garden</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="petals" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">漢字の庭</p>
        <h1>Kanjis Garden</h1>
        <p class="subtitle">Treine as leituras dos kanjis do New Progressive 1 e 2.</p>
      </div>
      <button id="themeToggle" class="icon-button" type="button" aria-label="Alternar tema">☾</button>
    </header>

    <section id="homeView" class="view active" aria-labelledby="homeTitle">
      <div class="panel intro-panel">
        <div>
          <p class="section-kicker">Seu jardim</p>
          <h2 id="homeTitle">Escolha como treinar</h2>
          <p id="selectionSummary" class="muted"></p>
        </div>
        <button id="openSelection" class="secondary-button" type="button">Selecionar kanjis</button>
      </div>

      <div class="mode-grid" aria-label="Modos de treino">
        <button class="mode-card" type="button" data-mode="10">
          <strong>10</strong><span>kanjis</span><small>Foco rápido nos mais recentes</small>
        </button>
        <button class="mode-card" type="button" data-mode="20">
          <strong>20</strong><span>kanjis</span><small>Revisão intermediária</small>
        </button>
        <button class="mode-card" type="button" data-mode="30">
          <strong>30</strong><span>kanjis</span><small>Revisão longa</small>
        </button>
        <button class="mode-card" type="button" data-mode="full">
          <strong>全</strong><span>Completo</span><small>Todos os selecionados, sem repetir</small>
        </button>
        <button class="mode-card wide" type="button" data-mode="infinite">
          <strong>∞</strong><span>Infinito</span><small>Ciclos sem repetição, sempre priorizando os mais recentes</small>
        </button>
      </div>

      <div class="stats-row" aria-label="Estatísticas">
        <div class="stat"><strong id="statAnswered">0</strong><span>respondidos</span></div>
        <div class="stat"><strong id="statCorrect">0</strong><span>acertos</span></div>
        <div class="stat"><strong id="statAccuracy">—</strong><span>precisão</span></div>
      </div>
    </section>

    <section id="selectionView" class="view" aria-labelledby="selectionTitle">
      <div class="view-header">
        <button id="backFromSelection" class="text-button" type="button">← Voltar</button>
        <div>
          <p class="section-kicker">Conteúdo</p>
          <h2 id="selectionTitle">Selecionar kanjis</h2>
        </div>
      </div>

      <div class="selection-toolbar panel">
        <span id="selectedCount"></span>
        <div class="toolbar-actions">
          <button id="selectAll" class="text-button" type="button">Marcar todos</button>
          <button id="restoreDefaults" class="text-button" type="button">Restaurar 39 iniciais</button>
        </div>
      </div>
      <div id="kanjiSelection" class="curriculum-list"></div>
    </section>

    <section id="gameView" class="view" aria-labelledby="gameTitle">
      <div class="game-topbar">
        <button id="exitGame" class="text-button" type="button">← Sair</button>
        <span id="gameProgress" class="progress-label"></span>
      </div>

      <div class="progress-track" aria-hidden="true"><div id="progressBar"></div></div>

      <article class="kanji-card panel">
        <p id="gameTitle" class="section-kicker">Qual é a leitura?</p>
        <div id="currentKanji" class="kanji-glyph" lang="ja">一</div>
        <p id="currentMeta" class="muted"></p>

        <form id="answerForm" autocomplete="off">
          <label class="sr-only" for="answerInput">Digite a leitura</label>
          <input id="answerInput" type="text" inputmode="text" placeholder="romaji, ひらがな ou カタカナ" autocapitalize="none" spellcheck="false">
          <div class="answer-actions">
            <button id="dontKnow" class="secondary-button" type="button">Não sei</button>
            <button id="confirmAnswer" class="primary-button" type="submit">Confirmar</button>
          </div>
        </form>

        <div id="feedback" class="feedback" aria-live="polite"></div>
        <button id="nextKanji" class="primary-button full hidden" type="button">Próximo</button>
      </article>
    </section>

    <section id="resultView" class="view" aria-labelledby="resultTitle">
      <article class="panel result-card">
        <p class="section-kicker">Sessão concluída</p>
        <h2 id="resultTitle">おつかれさま！</h2>
        <div class="result-score"><strong id="resultCorrect">0</strong><span id="resultTotal">/ 0</span></div>
        <p id="resultAccuracy" class="muted"></p>
        <div class="result-actions">
          <button id="repeatSession" class="primary-button" type="button">Treinar novamente</button>
          <button id="backHome" class="secondary-button" type="button">Voltar ao início</button>
        </div>
      </article>
    </section>
  </main>

  <script src="data/kanjis.js"></script>
  <script src="data/reading-details.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
